# Partner-priority weights for the cross-attribute weighted-macro aggregator.
#
# Default: every attribute gets weight 1.0 (== unweighted macro average).
# BC Parks can hand us a replacement of this file at any time to change
# priorities WITHOUT re-running any model: the leaderboard reads this
# config and re-aggregates from the per-attribute scores already logged
# to MLflow.
#
# Weights only need to be positive numbers; they are normalised at use
# time so any scale works ("relative importance").  Use 0 to drop an
# attribute from the weighted aggregate.
#
# This file is the resolved-on-disk version.  `configs/weights/*.yaml`
# is the folder for proposal scenarios (e.g. weights_safety.yaml,
# weights_materials.yaml) once we elicit them from the partner.

version: 1
name: "equal_weights"
description: "Placeholder all-equal weights.  Replace with BC Parks priorities."

weights:
  attr_abutment_material: 1.0
  attr_bridge_type: 1.0
  attr_decking_material: 1.0
  attr_fall_height: 1.0
  attr_has_edge_guard: 1.0
  attr_has_pedestrian_railing: 1.0
  attr_length: 1.0
  "attr_material_frame,_tank,_body": 1.0
  attr_number_of_steps: 1.0
  attr_structure_material: 1.0
  attr_structure_position: 1.0
  attr_width: 1.0
